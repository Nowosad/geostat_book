on:
  push:
    branches:
      master
name: Render
jobs:
  bookdown:
    name: Render-Book
    runs-on: ubuntu-latest
    # container: ghcr.io/geocompx/docker:suggests
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Cache bookdown results
        uses: actions/cache@v4
        with:
          path: _bookdown_files
          key: bookdown-${{ hashFiles('**/*Rmd') }}
          restore-keys: bookdown-
    
      - uses: actions/checkout@v4
      - name: Render Book
        run: |
          R -e "install.packages('tinytex')"
          R -e "install.packages('rmarkdown')"
          R -e "install.packages('curl')"
          R -e "install.packages('latex2exp')"
          R -e "install.packages(c('bslib', 'downlit', 'xml2', 'metathis'))"
          R -e "tinytex::install_tinytex()"
          R -e "install.packages('geostatbook', repos = c('https://nowosad.r-universe.dev', 'https://cloud.r-project.org'))"
          Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::pdf_book")'
          Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book", clean = FALSE)'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          commit_message: 'Deploy commit: ${{ github.event.head_commit.message }}'
